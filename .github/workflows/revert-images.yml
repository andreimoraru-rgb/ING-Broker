name: Revert Corrupted Images

on:
  workflow_dispatch:

jobs:
  revert-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore images
        run: |
          git checkout 3a3a2ec1720a3c440b8d83a8e951e44685a76a17 -- public/
          git checkout 3a3a2ec1720a3c440b8d83a8e951e44685a76a17 -- src/pages/
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ src/pages/
          git diff --staged --quiet || git commit -m "fix: restore images to pre-corruption state"
          git push origin main