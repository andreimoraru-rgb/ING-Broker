name: Fix Missing Benefits Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Download and fix missing images
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fix Group_Health_Insurance.png - download from Unsplash and convert to real PNG
          curl -L -o /tmp/group_health.jpg "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&q=80&fm=jpg"
          convert /tmp/group_health.jpg public/Group_Health_Insurance.png
          echo "Group_Health_Insurance.png created:"
          file public/Group_Health_Insurance.png

          # Fix conect-people.png - IT people in office, convert it-company.jpg to PNG
          convert public/it-company.jpg public/conect-people.png
          echo "conect-people.png created from it-company.jpg:"
          file public/conect-people.png

          # Fix health.png - download health/medical image from Unsplash and convert to PNG
          curl -L -o /tmp/health.jpg "https://images.unsplash.com/photo-1576091160550-2173dba999ef?w=1200&q=80&fm=jpg"
          convert /tmp/health.jpg public/health.png
          echo "health.png created:"
          file public/health.png

          # Fix retentie IT.png - copy from it-companies.jpg as PNG
          convert public/it-companies.jpg "public/retentie IT.png"
          echo "retentie IT.png created:"
          file "public/retentie IT.png"

          git add public/Group_Health_Insurance.png public/conect-people.png public/health.png "public/retentie IT.png"
          git diff --staged --stat
          git commit -m "fix: replace corrupted benefits images with properly converted PNG files" || echo "Nothing to commit"

      - name: Push changes
        run: git push origin main
