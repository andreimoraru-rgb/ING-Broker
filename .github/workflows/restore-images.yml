name: Restore Corrupted Images

on:
  workflow_dispatch:

jobs:
  restore-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore images from good commit
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout b2e60ed48570623f80784ab50635be2f3251240d -- public/
          git checkout b2e60ed48570623f80784ab50635be2f3251240d -- "conect people (2).png"
          git checkout b2e60ed48570623f80784ab50635be2f3251240d -- "cyber-insurance-2.webp"
          git add -A
          git commit -m "fix: restore corrupted images from b2e60ed"

      - name: Push changes
        run: |
          git push origin main
