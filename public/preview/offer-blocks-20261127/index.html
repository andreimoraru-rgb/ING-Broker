const phone=()=>`<a class="sub-action" href="tel:+37369526003" data-demo>${I.phone}<span>+373 69 526 003</span></a>`;
const footer=()=>`<footer class="footer"><span>${I.pin}Pan Halippa 9, Chișinău, Republica Moldova</span><a href="mailto:andrei.moraru@ingbroker.md" data-demo>${I.mail}andrei.moraru@ingbroker.md</a><a href="tel:+37369526003" data-demo>${I.phone}+373 69 526 003</a></footer>`;
const eyebrow=c=>`<div class="eyebrow">${esc(c.eyebrow)}</div>`;
function block(n){const c=copy[lang],note=`<p class="micro">${esc(c.terms)}</p>`;if(n===1)return`<section class="section offer-one"><div>${eyebrow(c)}<h2>${esc(c.h1)}</h2><p>${esc(c.desc)}</p><div class="cta-row">${action(c.button)}${phone()}</div>${note}</div><aside class="aside"><h3 class="aside-title">${esc(c.aside)}</h3><ul>${c.items.map(x=>`<li>${I.check}<span>${esc(x)}</span></li>`).join('')}</ul><div class="aside-foot">${esc(c.privacy)}</div></aside></section>`;
if(n===2)return`<section class="section offer-two"><div>${eyebrow(c)}<h2>${esc(c.h2)}</h2><p>${esc(c.desc)}</p>${note}</div><aside class="contact-paper"><div class="small-label">${esc(c.team)}</div><h3>${esc(c.direct)}</h3><a href="tel:+37369526003" class="phone-number" data-demo>+373 69 526 003</a>${action(c.talk)}<p class="micro">${esc(c.privacy)}</p></aside></section><div class="two-note">${I.check}<span>${esc(c.review)} · Insurance ING Broker SRL</span></div>`;
if(n===3)return`<section class="section offer-three"><div class="copy">${eyebrow(c)}<h2>${esc(c.h3)}</h2><p>${esc(c.short)}</p></div><div class="band-actions">${action(c.button)}${phone()}${note}</div></section>`;
if(n===4)return`<section class="section offer-four"><div>${eyebrow(c)}<h2>${esc(c.h4)}</h2><p class="intro">${esc(c.desc)}</p>${note}</div><form class="form-card" data-demo-form><div class="row"><label>${esc(c.company)}<input name="company" placeholder="${esc(c.companyHint)}" autocomplete="off"></label><label>${esc(c.contact)}<input name="contact" placeholder="${esc(c.contactHint)}" autocomplete="off"></label></div><label>${esc(c.needs)}<textarea name="needs" rows="2" placeholder="${esc(c.needsHint)}"></textarea></label><button class="action" type="submit">${esc(c.prepare)}${I.arrow}</button><p class="micro">${esc(c.note)}</p></form></section>`;
return`<section class="section offer-five"><div class="copy">${eyebrow(c)}<h2>${esc(c.h5)}</h2><p>${esc(c.desc)}</p><div class="cta-row">${action(c.button)}</div>${note}</div><div class="photo"><img src="https://www.ingbroker.md/images/articles/moldova/it-livrare-responsabilitate-modern-scene-20261109.webp" alt="${lang==='ro'?'Discuție despre documente și sisteme informatice':lang==='ru'?'Обсуждение документов и информационных систем':'Reviewing documents and information systems'}"><div class="photo-caption"><strong>Insurance ING Broker</strong><span>${esc(c.sector)}</span></div></div></section>`;}
function frame(n){return`<div class="stage ${mobile?'mobile':''}" data-model="${n}"><div class="context"><img src="https://www.ingbroker.md/Logo%20ING%20Broker.png" alt="Insurance ING Broker"><span>${esc(copy[lang].sector)}</span></div>${block(n)}${footer()}</div>`;}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.size==='mobile')===mobile)));document.querySelector('#all').setAttribute('aria-pressed',String(all));document.querySelector('.tabs').innerHTML=models.map((m,i)=>`<button class="tab" role="tab" aria-selected="${!all&&chosen===i+1}" aria-controls="canvas" tabindex="${(all?i===0:chosen===i+1)?0:-1}" data-model="${i+1}"><span class="num">${i+1}</span><span><strong>${m.name}</strong><small>${i===0?'Recomandat':m.sub}</small></span></button>`).join('');document.querySelector('#canvas').innerHTML=all?`<div class="all-mode">${models.map((m,i)=>`<article class="all-item"><div class="all-label">${i+1}. ${m.name}${i===0?' - recomandat':''}</div>${frame(i+1)}</article>`).join('')}</div>`:frame(chosen);document.querySelector('#model-title').innerHTML=`${chosen}. ${models[chosen-1].name}${chosen===1?'<span class="recommend">Recomandat</span>':''}`;document.querySelector('#model-description').textContent=models[chosen-1].why;document.querySelector('#choose').textContent=`Aleg modelul ${chosen}`;document.querySelector('.proposal-info').hidden=all;const u=new URL(location.href);u.searchParams.set('lang',lang);u.searchParams.set('model',chosen);history.replaceState(null,'',u);}
document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){chosen=Number(tab.dataset.model);all=false;render();return;}const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;render();return;}const size=e.target.closest('[data-size]');if(size){mobile=size.dataset.size==='mobile';all=false;render();return;}if(e.target.closest('#all')){all=!all;render();return;}if(e.target.closest('#choose')){document.querySelector('#selection').textContent=`Modelul ${chosen} este selectat. Scrie „${chosen}” în chat pentru a continua cu acest design.`;return;}if(e.target.closest('[data-demo]')){e.preventDefault();showDemo();}});
document.addEventListener('keydown',e=>{const tab=e.target.closest('.tab');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();chosen=e.key==='Home'?1:e.key==='End'?5:((Number(tab.dataset.model)-1+(e.key==='ArrowRight'?1:4))%5)+1;all=false;render();document.querySelector('.tab[data-model="'+chosen+'"]').focus();});
document.addEventListener('submit',e=>{if(e.target.matches('[data-demo-form]')){e.preventDefault();showDemo();}});
const dialog=document.querySelector('dialog');function showDemo(){const c=copy[lang];document.querySelector('#demo-title').textContent=c.next;document.querySelector('#demo-copy').textContent=c.demo;document.querySelector('#demo-ok').textContent=c.ok;document.querySelector('.demo-close').setAttribute('aria-label',c.close);dialog.showModal();}document.querySelector('#demo-ok').onclick=()=>dialog.close();document.querySelector('.demo-close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
if(new URLSearchParams(location.search).get('overview')==='1'){all=true;document.body.classList.add('overview-mode');}render();
</script></body></html>
